# ==============================================================
# NGINX PRODUCTION CONFIGURATION FOR PHONE TRADING HUB
# Deploy to: /etc/nginx/sites-available/phone-trading-hub
# Enable with: ln -s /etc/nginx/sites-available/phone-trading-hub /etc/nginx/sites-enabled/
# Test with: nginx -t && systemctl reload nginx
# ==============================================================

# 1. HTTP Server - Redirects to HTTPS (or proxies locally if SSL not yet configured)
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com; # Replace with your VPS domain or public IP

    # Un-comment to enforce HTTPS once certbot is installed:
    # return 301 https://$host$request_uri;

    client_max_body_size 15M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CRITICAL SECURITY: Block all access to SQLite databases, journals, backups, git, and env
    location ~* \.(db|sqlite|sqlite3|wal|shm|sql|env|log)$ {
        deny all;
        return 404;
    }

    location ^~ /data/ {
        deny all;
        return 404;
    }

    location ^~ /.git {
        deny all;
        return 404;
    }

    # Static assets caching (Vite build output)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Reverse proxy to Node.js / Express running strictly on 127.0.0.1:3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

